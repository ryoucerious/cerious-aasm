name: Build Electron App

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Gate: the packaging jobs below only run if the full test suite passes, so a tagged
  # release can never be built from a red suite.
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build-windows:
    needs: test
    permissions:
      contents: read
    # Pinned (not windows-latest): GitHub's rolling windows-latest image moved to a newer
    # Visual Studio that node-gyp@9.x (used by @electron/rebuild for bcrypt/node-pty) fails
    # to detect ("Could not find any Visual Studio installation"). windows-2022 matches the
    # environment every prior release (v1.0.5-v1.0.14) built successfully on.
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python setuptools
        run: python -m pip install setuptools
      - name: Set Python environment variables
        run: |
          echo "PYTHON_EXECUTABLE=python" >> $env:GITHUB_ENV
          echo "npm_config_python=python" >> $env:GITHUB_ENV
          echo "npm_config_prefer_offline=true" >> $env:GITHUB_ENV
      - name: Update npm
        # Pinned to npm@11 (not npm@latest): npm@12 requires Node >=22, but these
        # runners use Node 20 (the environment every prior release built on). npm@11
        # is the latest major compatible with Node 20.
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Inject CurseForge API Key
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: (Get-Content src/environments/environment.prod.ts) -replace 'CURSEFORGE_KEY_PLACEHOLDER', $env:CURSEFORGE_API_KEY | Set-Content src/environments/environment.prod.ts
      - name: Build for Windows
        run: npm run electron:package:windows
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-installer
          path: |
            dist-electron/*.exe
            dist-electron/*.exe.blockmap
            dist-electron/latest.yml

  build-linux:
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python setuptools
        run: python -m pip install setuptools
      - name: Update npm
        # Pinned to npm@11 (not npm@latest): npm@12 requires Node >=22, but these
        # runners use Node 20 (the environment every prior release built on). npm@11
        # is the latest major compatible with Node 20.
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Inject CurseForge API Key
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: sed -i "s|CURSEFORGE_KEY_PLACEHOLDER|${CURSEFORGE_API_KEY}|g" src/environments/environment.prod.ts
      - name: Build for Linux
        run: npm run electron:package:linux
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux-appimage
          path: |
            dist-electron/*.AppImage
            dist-electron/latest-linux.yml
      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux-deb
          path: dist-electron/*.deb
      - name: Upload Linux RPM
        uses: actions/upload-artifact@v4
        with:
          name: electron-linux-rpm
          path: dist-electron/*.rpm

  pack-runtime:
    # The archive a Docker container applies in place. It is the built app, not a new image.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Update npm
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Inject CurseForge API Key
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: sed -i "s|CURSEFORGE_KEY_PLACEHOLDER|${CURSEFORGE_API_KEY}|g" src/environments/environment.prod.ts
      - name: Build the runtime archive
        run: |
          npm run build
          npx tsc -p tsconfig.electron.json
          tar -czf cerious-aasm-runtime.tar.gz package.json dist electron
      - name: Upload runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: docker-runtime
          path: cerious-aasm-runtime.tar.gz

  build-docker:
    # Also needs the desktop builds, not just test, so a failed Windows/Linux package
    # can't leave a passing :latest image behind.
    needs: [test, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/ryoucerious/cerious-aasm:${{ github.ref_name }}
            ghcr.io/ryoucerious/cerious-aasm:latest
          secrets: |
            curseforge_api_key=${{ secrets.CURSEFORGE_API_KEY }}

  create-release:
    needs: [build-windows, build-linux, pack-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: electron-windows-installer
          path: ./release-files/
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: electron-linux-appimage
          path: ./release-files/
      - name: Download Linux DEB
        uses: actions/download-artifact@v4
        with:
          name: electron-linux-deb
          path: ./release-files/
      - name: Download Linux RPM
        uses: actions/download-artifact@v4
        with:
          name: electron-linux-rpm
          path: ./release-files/
      - name: Download Docker runtime archive
        uses: actions/download-artifact@v4
        with:
          name: docker-runtime
          path: ./release-files/
      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
