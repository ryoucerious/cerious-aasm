<div *ngIf="isLoginPage" class="login-page-container">
  <router-outlet></router-outlet>
</div>

<!-- Nothing of the app until access is confirmed: see showApp. -->
<ng-container *ngIf="showApp; else notReady">
  <!-- Inert under the busy overlay: nothing behind it can be clicked or typed into. -->
  <div class="app-root-wrapper" [attr.inert]="busy.message !== null ? '' : null" [attr.aria-busy]="busy.message !== null">
    <app-topbar [isMobile]="isMobile" [menuOpen]="isMobileMenuOpen" (menuToggle)="toggleMobileMenu()"></app-topbar>

    <div class="app-container">
      <div *ngIf="isMobile && isMobileMenuOpen" class="mobile-overlay" (click)="closeMobileMenu()"></div>

      <div class="sidebar-container" [class.mobile-open]="isMobile && isMobileMenuOpen">
        <app-sidebar (selectServer)="onServerSelected($event)" (closeMobileMenu)="closeMobileMenu()"></app-sidebar>
      </div>

      <div class="main-content" [class.mobile-menu-open]="isMobile && isMobileMenuOpen">
        <router-outlet></router-outlet>

        <app-modal [show]="showExitModal" [title]="'Servers Running'" (close)="onExitModalClose('cancel')">
          <div>
            <p>There are running servers. What would you like to do?</p>
            <ul *ngIf="runningServers && runningServers.length > 0">
              <li *ngFor="let server of runningServers">{{ server.name }}</li>
            </ul>
            <div class="action-group-modal">
              <button class="btn" [disabled]="shuttingDown" (click)="onExitModalClose('cancel')">Cancel</button>
              <button class="btn" [disabled]="shuttingDown" (click)="onExitModalClose('exit')">Exit Anyway</button>
              <button class="btn btn-danger" [disabled]="shuttingDown" (click)="onExitModalClose('shutdown')">
                {{ shuttingDown ? 'Stopping servers...' : 'Shut Down Servers & Exit' }}
              </button>
            </div>
          </div>
        </app-modal>
      </div>
    </div>

    <!-- Settings live in a drawer over the current page rather than a page of their own -->
    <app-settings-page></app-settings-page>
  </div>
</ng-container>
<!-- One tooltip for the whole app, in place of the browser's own -->
<app-tooltip-host></app-tooltip-host>
<!-- Over everything while something the app has to wait for is under way -->
<app-busy-overlay></app-busy-overlay>

<ng-template #notReady>
  <div *ngIf="showLoading" class="app-loading" role="status" aria-live="polite">
    <img class="app-loading-logo" src="assets/logo-square-256.png" alt="" />
    <h1 class="app-loading-title">Cerious AASM</h1>
    <span class="app-loading-spinner" aria-hidden="true"></span>
    <p class="app-loading-text">{{ isElectron ? 'Checking access…' : 'Connecting to the server…' }}</p>
  </div>
  <app-connection-lost *ngIf="!isElectron && !connecting && connectionLost"></app-connection-lost>
</ng-template>
