<!-- Laid out exactly like Whitelist and Mods: a page intro, then titled sections. The
     status, players and memory live in the server header above, so they are not repeated. -->
<div class="tab-content">
  <div class="form-group page-intro">
    <h4>Server Output</h4>
    <p class="form-control-label desc">
      Everything the server writes while it runs. It keeps updating as long as this page is open.
    </p>
  </div>

  <div class="settings-section">
    <h5>Console</h5>
    <p class="section-desc">{{ serverMessage || 'Live output from the running server.' }}</p>

    <div class="form-group span-all">
      <div class="console-log-container" #logContainer>
        <ng-container *ngIf="logs && logs.length; else noLogs">
          <div class="console-log-line" *ngFor="let line of logs">
            {{ line }}
          </div>
        </ng-container>
        <ng-template #noLogs>
          <div class="console-log-placeholder">
            No output yet. Start the server to see its logs.
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
