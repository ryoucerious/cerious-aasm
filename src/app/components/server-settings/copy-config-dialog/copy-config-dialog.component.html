<app-modal [title]="'Copy Config From Another Server'" [show]="show" [maxWidth]="'840px'" (close)="close.emit()">
  <div class="copy-config-modal">
    <div class="form-group">
      <label>Source Server</label>
      <div class="custom-dropdown" style="position: relative;">
        <button type="button" class="form-control input" (click)="toggleSourceDropdown()" style="width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text-primary); padding: 0.5rem 1rem; font-size: 0.97em; display: flex; align-items: center; justify-content: space-between;">
          <span>{{ source ? sourceDisplayName : 'Select a server...' }}</span>
          <span class="material-icons" style="font-size: 1.1em;">{{ sourceDropdownOpen ? 'arrow_drop_up' : 'arrow_drop_down' }}</span>
        </button>
        <div *ngIf="sourceDropdownOpen" class="dropdown-menu show" style="position: absolute; left: 0; right: 0; top: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; z-index: 20; width: 100%; margin-top: 0.1rem; max-height: 200px; overflow-y: auto;">
          <div *ngFor="let server of servers" (mousedown)="selectSource(server)" style="padding: 0.5rem 1rem; cursor: pointer; color: var(--text-primary); font-size: 0.97em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" [ngClass]="{'selected': source?.id === server.id}">
            {{ serverLabel(server) }}
          </div>
        </div>
      </div>
    </div>

    <div class="form-group" *ngIf="source">
      <label>Categories to Copy</label>
      <div class="copy-categories-header">
        <button class="btn btn-sm" (click)="selectAll(true)">Select All</button>
        <button class="btn btn-sm" (click)="selectAll(false)">Deselect All</button>
      </div>
      <div class="copy-categories-grouped">
        <div *ngFor="let group of categoryGroups" class="copy-category-group">
          <div class="copy-category-group-label">{{ group.label }}</div>
          <div class="copy-categories-grid">
            <label *ngFor="let category of group.categories" class="copy-category-item">
              <div class="toggle-label">
                <input type="checkbox" class="toggle-switch" [(ngModel)]="selected[category.key]">
                <span class="toggle-text">{{ category.label }}</span>
              </div>
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="action-group-modal">
      <button class="btn" (click)="close.emit()">Cancel</button>
      <button class="btn btn-primary"
              [disabled]="!source || !hasAnyCategorySelected"
              (click)="apply()">
        <i class="material-icons">content_copy</i> Apply
      </button>
    </div>
  </div>
</app-modal>
