<div class="page-panel settings-panel" *ngIf="isKnownTab">
  <div class="settings-toolbar">
    <div class="settings-toolbar-title">
      <h2>{{ pageTitle }}</h2>
      <span class="settings-toolbar-locked" *ngIf="isLocked && showExpertToggle" title="Stop the server to edit these settings">
        <i class="material-icons">lock</i> Read-only while running
      </span>
    </div>
    <div class="settings-toolbar-actions">
      <input type="file" #configFileInput hidden accept=".ini" (change)="onFileSelected($event)">
      <label class="toggle-label settings-expert-toggle" *ngIf="showExpertToggle" (click)="$event.stopPropagation()">
        <input type="checkbox" class="toggle-switch" [checked]="expertMode" (change)="toggleExpertMode($event)" tabindex="0" />
        <span class="toggle-text">Expert Mode</span>
      </label>
      <button class="btn btn-ghost btn-sm" (click)="onImportConfig($event)" [disabled]="isLocked" title="Import settings from an INI file">
        <i class="material-icons">file_upload</i> Import
      </button>
      <button class="btn btn-ghost btn-sm" (click)="onExportConfig($event)" title="Export server configuration as ZIP">
        <i class="material-icons">file_download</i> Export
      </button>
      <button class="btn btn-ghost btn-sm" (click)="onOpenCopyConfig($event)" [disabled]="isLocked" title="Copy settings from another server">
        <i class="material-icons">content_copy</i> Copy from
      </button>
      <button *ngIf="isElectron" class="btn btn-ghost btn-sm" (click)="onOpenDirectory($event)" title="Open server directory">
        <i class="material-icons">folder_open</i>
      </button>
    </div>
  </div>
  <div class="settings-body">

    <app-ini-editor
      *ngIf="isInIniTab"
      [instanceId]="serverInstance?.id"
      [filename]="iniFilename">
    </app-ini-editor>

    <app-general-tab
      *ngIf="activeTab === 'general'"
      [serverInstance]="serverInstance"
      [isLocked]="isLocked"
      [generalFields]="generalFields"
      [dropdownOpen]="dropdownOpen"
      [fieldErrors]="fieldErrors"
      [fieldWarnings]="fieldWarnings"
      (saveSettings)="settingsChanged.emit()"
      (validateField)="validateField($event.key, $event.value)"
      (toggleMultiOption)="toggleMultiOption.emit({ fieldKey: $event.key, option: $event.option, checked: $event.checked })"
      (comboCommit)="commitField($event.key, $event.value)"
      (dropdownToggle)="dropdownOpen = $event">
    </app-general-tab>

    <app-rates-tab
      *ngIf="activeTab === 'rates'"
      [serverInstance]="serverInstance"
      [isLocked]="isLocked"
      [ratesFields]="ratesFields"
      [fieldErrors]="fieldErrors"
      [fieldWarnings]="fieldWarnings"
      (saveSettings)="settingsChanged.emit()"
      (validateField)="validateField($event.key, $event.value)">
    </app-rates-tab>

    <app-structures-tab
      *ngIf="activeTab === 'structures'"
      [serverInstance]="serverInstance"
      [isLocked]="isLocked"
      [structuresFields]="structuresFields"
      [fieldErrors]="fieldErrors"
      [fieldWarnings]="fieldWarnings"
      (saveSettings)="settingsChanged.emit()"
      (validateField)="validateField($event.key, $event.value)">
    </app-structures-tab>

    <app-stat-multipliers-tab
      *ngIf="activeTab === 'stats'"
      [serverInstance]="serverInstance"
      [isLocked]="isLocked"
      [statList]="statList"
      [selectedStatIndex]="selectedStatIndex"
      [statSelectorDropdownOpen]="statSelectorDropdownOpen"
      (statMultiplierChanged)="statMultiplierChanged.emit($event)"
      (resetStatToDefaults)="resetStatToDefaults.emit($event)"
      (copyStatToAll)="copyStatToAll.emit($event)"
      (toggleStatSelectorDropdown)="toggleStatSelectorDropdown()"
      (statSelectorSelect)="onStatSelectorSelect($event)">
    </app-stat-multipliers-tab>

    <app-misc-tab
      *ngIf="activeTab === 'misc'"
      [serverInstance]="serverInstance"
      [isLocked]="isLocked"
      [miscFields]="miscFields"
      [fieldErrors]="fieldErrors"
      [fieldWarnings]="fieldWarnings"
      (saveSettings)="settingsChanged.emit()"
      (validateField)="validateField($event.key, $event.value)">
    </app-misc-tab>

    <app-cluster-tab
      *ngIf="activeTab === 'cluster'"
      [serverInstance]="serverInstance"
      [isLocked]="isLocked"
      [isElectron]="isElectron"
      [fieldErrors]="fieldErrors"
      [fieldWarnings]="fieldWarnings"
      (saveSettings)="settingsChanged.emit()"
      (validateField)="validateField($event.key, $event.value)"
      (testConnectivity)="testClusterConnectivity()">
    </app-cluster-tab>

    <app-mods-tab
      *ngIf="activeTab === 'mods'"
      [isLocked]="isLocked"
      [modList]="modList"
      (addMod)="addMod.emit($event)"
      (removeMod)="removeMod.emit($event)"
      (toggleMod)="toggleMod.emit($event)"
      (updateModSettings)="updateModSettings.emit($event)">
    </app-mods-tab>

    <app-whitelist-tab
      *ngIf="activeTab === 'whitelist'"
      [serverInstance]="serverInstance"
      [isLocked]="isLocked"
      (saveSettings)="settingsChanged.emit()"
      (validateField)="validateField($event.key, $event.value)">
    </app-whitelist-tab>

    <app-backup-tab
      *ngIf="activeTab === 'backup'"
      [backupScheduleEnabled]="backupScheduleEnabled"
      [backupFrequency]="backupFrequency"
      [backupTime]="backupTime"
      [backupDayOfWeek]="backupDayOfWeek"
      [maxBackupsToKeep]="maxBackupsToKeep"
      [backupList]="backupList"
      [backupFrequencyDropdownOpen]="backupFrequencyDropdownOpen"
      [backupDayDropdownOpen]="backupDayDropdownOpen"
      [fieldErrors]="fieldErrors"
      [fieldWarnings]="fieldWarnings"
      (createManualBackup)="createManualBackup.emit()"
      (backupScheduleToggle)="backupScheduleToggle.emit()"
      (backupFrequencySelect)="onBackupFrequencySelect($event)"
      (backupTimeChange)="backupTimeChange.emit($event)"
      (backupDaySelect)="onBackupDaySelect($event)"
      (maxBackupsToKeepChange)="maxBackupsToKeepChange.emit($event)"
      (restoreBackup)="restoreBackup.emit($event)"
      (downloadBackup)="downloadBackup.emit($event)"
      (deleteBackup)="deleteBackup.emit($event)"
      (validateField)="validateField($event.key, $event.value)"
      (toggleBackupFrequencyDropdown)="toggleBackupFrequencyDropdown()"
      (toggleBackupDayDropdown)="toggleBackupDayDropdown()">
    </app-backup-tab>

    <app-automation-tab
      *ngIf="activeTab === 'automation'"
      [serverInstance]="serverInstance"
      [restartFrequencyDropdownOpen]="restartFrequencyDropdownOpen"
      [fieldErrors]="fieldErrors"
      [fieldWarnings]="fieldWarnings"
      (saveAutoStartSettings)="saveAutoStartSettings.emit()"
      (saveCrashDetectionSettings)="saveCrashDetectionSettings.emit()"
      (saveScheduledRestartSettings)="saveScheduledRestartSettings.emit()"
      (validateField)="validateField($event.key, $event.value)"
      (restartDayToggle)="onRestartDayToggle($event.dayIndex, $event.checked)"
      (restartFrequencySelect)="onRestartFrequencySelect($event)"
      (toggleRestartFrequencyDropdown)="toggleRestartFrequencyDropdown()">
    </app-automation-tab>

    <app-firewall-tab
      *ngIf="activeTab === 'firewall'"
      [serverInstance]="serverInstance"
      [firewallStatus]="firewallStatus">
    </app-firewall-tab>

    <app-discord-tab
      *ngIf="activeTab === 'discord'"
      [serverInstance]="serverInstance"
      [isLocked]="isLocked"
      (saveSettings)="settingsChanged.emit()">
    </app-discord-tab>

    <app-broadcasts-tab
      *ngIf="activeTab === 'broadcasts'"
      [serverInstance]="serverInstance"
      [isLocked]="isLocked"
      (saveSettings)="settingsChanged.emit()">
    </app-broadcasts-tab>

    <app-ark-api-tab
      *ngIf="activeTab === 'arkapi'"
      [serverInstance]="serverInstance">
    </app-ark-api-tab>

  </div>
</div>

<app-copy-config-dialog
  [show]="showCopyConfig"
  [target]="serverInstance"
  (close)="showCopyConfig = false"
  (applied)="onConfigCopied()">
</app-copy-config-dialog>
