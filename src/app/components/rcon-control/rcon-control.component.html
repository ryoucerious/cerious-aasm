<!-- The console page's second section, in the same shape as the first. -->
<div class="tab-content">
  <div class="settings-section">
    <h5>RCON</h5>
    <p class="section-desc">
      {{ rconConnected && serverState === 'Running'
          ? 'Connected. Send a command or a message to the running server.'
          : 'Commands can be sent once the server is running and RCON has connected.' }}
    </p>

    <div class="form-group span-all">
      <label class="form-control-label">Command</label>
      <div class="rcon-send-row">
        <div class="rcon-input-wrap">
          <input class="form-control input" [(ngModel)]="rconMessage"
                 [disabled]="!rconConnected || serverState !== 'Running'"
                 placeholder="Type an RCON command or a message..."
                 (keyup.enter)="onSendMessage()" (focus)="onInputFocus()" (blur)="onInputBlur()" />
          <div *ngIf="inputFocused" class="rcon-known-commands">
            <div *ngFor="let cmd of knownCommands" (mousedown)="fillCommand(cmd)" class="rcon-known-command">
              {{ cmd }}
            </div>
          </div>
        </div>
        <button class="btn btn-primary"
                [disabled]="!rconConnected || serverState !== 'Running' || !rconMessage.trim()"
                (click)="onSendMessage()">
          <i class="material-icons">send</i> Send
        </button>
      </div>
      <label class="form-control-label desc">Enter sends the command, the same as the button.</label>
    </div>

    <div class="form-group span-all" *ngIf="lastResponse">
      <label class="form-control-label">Last response</label>
      <div class="rcon-response">{{ lastResponse }}</div>
    </div>
  </div>
</div>
