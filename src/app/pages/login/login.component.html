<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <img class="login-logo" src="assets/logo-square-256.png" alt="" />
      <h1>Cerious AASM</h1>
      <h2>{{ heading }}</h2>
      <p class="settings-card-hint" *ngIf="hint">{{ hint }}</p>
    </div>
    <div class="login-form">
      <div class="form-group">
        <label class="form-control-label">Username</label>
        <input 
          type="text" 
          [(ngModel)]="username" 
          (keydown)="onEnterKey($event)"
          class="form-control" 
          placeholder="Enter username"
          autofocus
        />
      </div>
      <div class="form-group">
        <label class="form-control-label">Password</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          (keydown)="onEnterKey($event)"
          class="form-control" 
          placeholder="Enter password"
        />
      </div>
      <div class="login-error" *ngIf="errorMessage" role="alert">
        <i class="material-icons">error_outline</i>
        <span>{{ errorMessage }}</span>
      </div>
      <div class="form-group button-group" style="margin-top: 20px;">
        <button 
          class="btn" 
          (click)="onLogin()" 
          [disabled]="!username.trim() || !password || isLoading"
        >
          <span *ngIf="!isLoading">{{ creatingAdmin ? 'Create admin' : 'Login' }}</span>
          <span *ngIf="isLoading">Logging in...</span>
        </button>
      </div>
    </div>
  </div>
</div>
