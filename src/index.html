<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cerious AASM</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/logo-square-256.png">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    // Applies the theme before first paint: Angular boots after it, so light-mode users would
    // see a dark flash. ThemeService repeats this logic with the same storage key.
    (function () {
      try {
        var stored = localStorage.getItem('cerious-aasm.theme');
        var choice = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
        var resolved = choice === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : choice;
        document.documentElement.setAttribute('data-theme', resolved);
      } catch (e) {
        // Storage unavailable: the stylesheet follows the OS until ThemeService runs.
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
